<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kelsey wang</title>
  <style>
    :root {
      --orange: #e8622a;
      --bg: #ffffff;
      --muted: #999;
      --divider: #e8e8e8;
      --paper: #faf7f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #1c1c1c;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 50;
    }
    .name {
      color: var(--orange);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    /* ── drop zone ─────────────────────────────────────────── */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 60;
      background: var(--bg);
      transition: background 0.2s, opacity 0.4s;
    }
    #drop-zone.drag-over { background: #fdf4f0; }
    #drop-zone.hidden { opacity: 0; pointer-events: none; }
    #drop-zone p { color: var(--muted); font-size: 12px; letter-spacing: 0.02em; }
    #drop-zone label {
      color: var(--orange); font-size: 12px; cursor: pointer;
      border-bottom: 1px solid var(--orange); padding-bottom: 1px;
      transition: opacity 0.15s;
    }
    #drop-zone label:hover { opacity: 0.65; }
    #file-input { display: none; }

    /* ── book stage ────────────────────────────────────────── */
    #book-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 56px 84px;
      opacity: 0;
      transition: opacity 0.5s;
      perspective: 2200px;
      perspective-origin: 50% 42%;
    }
    #book-stage.visible { opacity: 1; }

    #book {
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* contact shadow on imaginary surface beneath the book */
    #book::after {
      content: '';
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -10px;
      height: 26px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.12), rgba(0,0,0,0) 65%);
      z-index: 0;
      pointer-events: none;
    }

    /* underlying spread — two squares side by side */
    #spread {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .cell {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.05),
        0 6px 18px rgba(0,0,0,0.07);
      transition: opacity 0.18s, box-shadow 0.18s;
    }
    .cell.left  { left: 0; }
    .cell.right { right: 0; }
    .cell.empty {
      background: transparent;
      box-shadow: none;
      opacity: 0;
    }
    .cell canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* spine — gutter shadow where the binding would be */
    #spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(50% - 16px);
      width: 32px;
      background: linear-gradient(to right,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.025) 30%,
        rgba(0,0,0,0.10) 50%,
        rgba(0,0,0,0.025) 70%,
        rgba(0,0,0,0) 100%);
      pointer-events: none;
      z-index: 5;
      opacity: 1;
      transition: opacity 0.32s;
    }
    #spine.hidden { opacity: 0; }

    /* cast shadow from the lifting leaf */
    #flip-shadow {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      will-change: opacity, background;
    }

    /* flipper — positioned at right cell, hinged on the spine */
    .flipper-lift {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }
    .flipper-lift.active { opacity: 1; }

    .flipper {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: 0 50%;
      will-change: transform;
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.05),
        0 10px 28px rgba(0,0,0,0.10),
        0 20px 44px rgba(0,0,0,0.06);
    }
    .face canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    .face.back {
      transform: rotateY(180deg);
    }

    /* per-face shading overlay, driven from JS */
    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      will-change: opacity, background;
    }

    /* ── nav ───────────────────────────────────────────────── */
    nav {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s 0.15s;
    }
    nav.visible { opacity: 1; pointer-events: auto; }
    .nav-btn {
      background: none; border: none; cursor: pointer;
      padding: 8px 10px; color: #2a2a2a;
      font-family: inherit; font-size: 16px; line-height: 1;
      transition: color 0.15s, transform 0.15s;
      user-select: none;
    }
    .nav-btn:hover:not(:disabled) { color: var(--orange); }
    .nav-btn:active:not(:disabled) { transform: scale(0.88); }
    .nav-btn:disabled { color: var(--divider); cursor: default; }
    #page-info {
      color: var(--muted); font-size: 11px;
      letter-spacing: 0.08em; min-width: 80px; text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── top-right ─────────────────────────────────────────── */
    #top-right {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s 0.15s;
    }
    #top-right.visible { opacity: 1; pointer-events: auto; }
    .corner-btn {
      color: var(--muted); font-size: 11px; cursor: pointer;
      transition: color 0.12s; background: none; border: none;
      font-family: inherit; letter-spacing: 0.03em;
    }
    .corner-btn:hover { color: var(--orange); }

    /* ── keyboard hint ─────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 30px;
      right: 28px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.4s 0.25s;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #hint.visible { opacity: 1; }
    kbd {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid var(--divider);
      border-radius: 3px;
      font-family: inherit;
      font-size: 9.5px;
      color: #666;
      line-height: 1;
    }

    /* ── loading ───────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 70;
    }
    #loading.visible { opacity: 1; }
    .dots { display: flex; gap: 6px; }
    .dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--orange);
      animation: dot 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <header><span class="name">kelsey wang</span></header>

  <div id="drop-zone" class="hidden">
    <p>drop pdf here</p>
    <label for="file-input">or browse</label>
    <input type="file" id="file-input" accept=".pdf,application/pdf">
  </div>

  <div id="book-stage">
    <div id="book">
      <div id="spread">
        <div class="cell left empty" id="left-cell"><canvas id="left-canvas"></canvas></div>
        <div class="cell right" id="right-cell"><canvas id="right-canvas"></canvas></div>
      </div>
      <div id="spine" class="hidden"></div>
      <div id="flip-shadow"></div>
      <div class="flipper-lift" id="flipper-lift">
        <div class="flipper" id="flipper">
          <div class="face front">
            <canvas id="flip-front-canvas"></canvas>
            <div class="shade" id="front-shade"></div>
          </div>
          <div class="face back">
            <canvas id="flip-back-canvas"></canvas>
            <div class="shade" id="back-shade"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="loading"><div class="dots"><span></span><span></span><span></span></div></div>

  <nav id="nav">
    <button class="nav-btn" id="prev-btn" aria-label="Previous">&#8592;</button>
    <span id="page-info"></span>
    <button class="nav-btn" id="next-btn" aria-label="Next">&#8594;</button>
  </nav>

  <div id="top-right">
    <button class="corner-btn" id="open-new-btn">open different pdf</button>
  </div>

  <div id="hint"><kbd>&larr;</kbd>&nbsp;<kbd>&rarr;</kbd></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ── config ───────────────────────────────────────────────
    // Set this to a relative path (e.g. 'portfolio.pdf') or absolute URL to
    // auto-load a PDF on page load. Leave '' to use the drop zone.
    // You can also override at runtime via the ?pdf= query parameter.
    const PDF_URL = 'portfoliofile.pdf';

    // ── elements ─────────────────────────────────────────────
    const dropZone        = document.getElementById('drop-zone');
    const fileInput       = document.getElementById('file-input');
    const stage           = document.getElementById('book-stage');
    const bookEl          = document.getElementById('book');
    const leftCell        = document.getElementById('left-cell');
    const rightCell       = document.getElementById('right-cell');
    const leftCanvas      = document.getElementById('left-canvas');
    const rightCanvas     = document.getElementById('right-canvas');
    const spineEl         = document.getElementById('spine');
    const flipperLift     = document.getElementById('flipper-lift');
    const flipper         = document.getElementById('flipper');
    const flipFrontCanvas = document.getElementById('flip-front-canvas');
    const flipBackCanvas  = document.getElementById('flip-back-canvas');
    const flipShadow      = document.getElementById('flip-shadow');
    const frontShade      = document.getElementById('front-shade');
    const backShade       = document.getElementById('back-shade');
    const navEl           = document.getElementById('nav');
    const topRight        = document.getElementById('top-right');
    const hint            = document.getElementById('hint');
    const pageInfo        = document.getElementById('page-info');
    const prevBtn         = document.getElementById('prev-btn');
    const nextBtn         = document.getElementById('next-btn');
    const openNewBtn      = document.getElementById('open-new-btn');
    const loading         = document.getElementById('loading');

    // ── state ────────────────────────────────────────────────
    let pdfDoc = null;
    let totalPages = 0;
    let totalLeafPositions = 0;
    let leafPos = 0;                 // 0 = cover; ≥1 = spread; last = end cover when T even
    let animating = false;
    let queuedDirection = 0;
    let cellSide = 0;                // each page cell is a square (cellSide × cellSide)
    const renderedCache = new Map(); // `${pageNum}:${cellSide}` → offscreen canvas

    // ── leaf model ───────────────────────────────────────────
    // A "leaf position" describes which two pages (if any) are visible:
    //   pos 0           → cover view:   left=null, right=page 1
    //   pos k ≥ 1       → spread:       left=2k,   right=2k+1
    //   last pos (even T) → end cover:   left=T,    right=null
    function getLeafPagesAtPos(pos) {
      if (pos < 0 || pos >= totalLeafPositions) return { left: null, right: null };
      if (pos === 0) {
        return { left: null, right: totalPages >= 1 ? 1 : null };
      }
      const L = 2 * pos;
      const R = 2 * pos + 1;
      return {
        left:  L <= totalPages ? L : null,
        right: R <= totalPages ? R : null
      };
    }

    function computeTotalLeafPositions() {
      if (totalPages === 0) return 0;
      return Math.ceil((totalPages + 1) / 2);
    }

    // book is always 2 cells wide; in cover/end states we translate it
    // so the visible solo cell sits at the viewport center.
    function computeTx(pages) {
      if (!pages.left && pages.right)  return -cellSide / 2;  // cover (right cell centered)
      if (pages.left  && !pages.right) return  cellSide / 2;  // end cover (left cell centered)
      return 0;
    }

    // ── load ─────────────────────────────────────────────────
    async function processPdfDocument(documentTask) {
      loading.classList.add('visible');
      try {
        const pdf = await documentTask.promise;
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        totalLeafPositions = computeTotalLeafPositions();
        leafPos = 0;
        renderedCache.clear();

        layoutBook();
        await applyCurrentLeaf();

        loading.classList.remove('visible');
        dropZone.classList.add('hidden');
        stage.classList.add('visible');
        navEl.classList.add('visible');
        topRight.classList.add('visible');
        hint.classList.add('visible');
        updateNav();
        prefetchAdjacent();
      } catch (err) {
        loading.classList.remove('visible');
        console.error('PDF load failed:', err);
      }
    }

    function loadFile(file) {
      if (!file || file.type !== 'application/pdf') return;
      const reader = new FileReader();
      reader.onload = e => {
        processPdfDocument(pdfjsLib.getDocument({ data: e.target.result }));
      };
      reader.readAsArrayBuffer(file);
    }

    function loadFromUrl(url) {
      processPdfDocument(pdfjsLib.getDocument(url));
    }

    // auto-load if a URL is configured (or passed via ?pdf=...);
    // otherwise reveal the drop zone for manual file selection.
    const params = new URLSearchParams(window.location.search);
    const autoUrl = params.get('pdf') || PDF_URL;
    if (autoUrl) {
      loadFromUrl(autoUrl);
    } else {
      dropZone.classList.remove('hidden');
    }

    fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
    openNewBtn.addEventListener('click', () => fileInput.click());

    document.addEventListener('dragover', e => {
      e.preventDefault();
      if (!pdfDoc) dropZone.classList.add('drag-over');
    });
    document.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    document.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      loadFile(e.dataTransfer.files[0]);
    });

    // ── layout ───────────────────────────────────────────────
    function layoutBook() {
      const availW = window.innerWidth - 112;
      const availH = window.innerHeight - 154;
      // each cell is a square; book is 2 cells wide
      cellSide = Math.floor(Math.min(availW / 2, availH));
      bookEl.style.width  = (cellSide * 2) + 'px';
      bookEl.style.height = cellSide + 'px';
    }

    // ── rendering ────────────────────────────────────────────
    async function renderPageToBitmap(pageNum) {
      if (!pageNum || !pdfDoc) return null;
      const key = `${pageNum}:${cellSide}`;
      if (renderedCache.has(key)) return renderedCache.get(key);

      const p = await pdfDoc.getPage(pageNum);
      const vp1 = p.getViewport({ scale: 1 });
      const dpr = window.devicePixelRatio || 1;
      // fit page into a square cell, preserving aspect (letterboxed)
      const fitScale = Math.min(cellSide / vp1.width, cellSide / vp1.height);
      const renderScale = fitScale * dpr;
      const vp = p.getViewport({ scale: renderScale });

      const off = document.createElement('canvas');
      off.width  = vp.width;
      off.height = vp.height;
      off._cssWidth  = vp.width  / dpr;
      off._cssHeight = vp.height / dpr;

      await p.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise;
      renderedCache.set(key, off);
      return off;
    }

    async function paintCanvas(pageNum, targetCanvas, targetCell) {
      if (pageNum == null) {
        targetCanvas.width = 0;
        targetCanvas.height = 0;
        targetCanvas.style.width = '0px';
        targetCanvas.style.height = '0px';
        if (targetCell) targetCell.classList.add('empty');
        return;
      }
      if (targetCell) targetCell.classList.remove('empty');
      const src = await renderPageToBitmap(pageNum);
      if (!src) return;
      targetCanvas.width  = src.width;
      targetCanvas.height = src.height;
      targetCanvas.style.width  = src._cssWidth  + 'px';
      targetCanvas.style.height = src._cssHeight + 'px';
      targetCanvas.getContext('2d').drawImage(src, 0, 0);
    }

    async function applyCurrentLeaf() {
      const pages = getLeafPagesAtPos(leafPos);
      await Promise.all([
        paintCanvas(pages.left,  leftCanvas,  leftCell),
        paintCanvas(pages.right, rightCanvas, rightCell),
      ]);
      bookEl.style.transform = `translateX(${computeTx(pages)}px)`;
      setSpineVisible(!!(pages.left && pages.right));
    }

    function setSpineVisible(visible) {
      if (visible) spineEl.classList.remove('hidden');
      else         spineEl.classList.add('hidden');
    }

    function prefetchAdjacent() {
      const fn = () => {
        for (let d = -1; d <= 1; d++) {
          const pos = leafPos + d;
          if (pos < 0 || pos >= totalLeafPositions) continue;
          const pages = getLeafPagesAtPos(pos);
          if (pages.left)  renderPageToBitmap(pages.left);
          if (pages.right) renderPageToBitmap(pages.right);
        }
      };
      if (window.requestIdleCallback) requestIdleCallback(fn);
      else setTimeout(fn, 120);
    }

    function formatLabel() {
      const pages = getLeafPagesAtPos(leafPos);
      if (pages.left && pages.right) return `${pages.left}–${pages.right} / ${totalPages}`;
      if (pages.left)                return `${pages.left} / ${totalPages}`;
      if (pages.right)               return `${pages.right} / ${totalPages}`;
      return `— / ${totalPages}`;
    }

    function updateNav() {
      pageInfo.textContent = formatLabel();
      prevBtn.disabled = leafPos === 0 || animating;
      nextBtn.disabled = leafPos === totalLeafPositions - 1 || animating;
    }

    // ── easing ───────────────────────────────────────────────
    // ease-in-out quart — slower start/end, faster middle. Feels weighted,
    // like the moment a real page commits to falling over.
    function easeInOutQuart(t) {
      return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
    }

    // ── the flip ─────────────────────────────────────────────
    // The flipper is always positioned at the right cell with its hinge on the spine.
    // Forward  (dir=+1): rotates 0 → −180°. Starts at rest on right showing FRONT,
    //                    ends visually on the left showing BACK.
    // Backward (dir=−1): rotates −180 → 0°. Starts visually on the left showing BACK,
    //                    ends at rest on right showing FRONT.
    //
    // The flipping leaf has a fixed identity across both directions:
    //   FRONT = page that appears as the right page of the lower-indexed position
    //   BACK  = page that appears as the left page of the higher-indexed position
    async function turnPage(direction) {
      if (animating) { queuedDirection = direction; return; }
      if (!pdfDoc) return;
      const newPos = leafPos + direction;
      if (newPos < 0 || newPos >= totalLeafPositions) return;
      animating = true;
      updateNav();

      const fromPages = getLeafPagesAtPos(leafPos);
      const toPages   = getLeafPagesAtPos(newPos);

      const flipFrontPage = direction > 0 ? fromPages.right : toPages.right;
      const flipBackPage  = direction > 0 ? toPages.left    : fromPages.left;

      // paint flipper faces
      await Promise.all([
        paintCanvas(flipFrontPage, flipFrontCanvas, null),
        paintCanvas(flipBackPage,  flipBackCanvas,  null),
      ]);

      // pre-update the spread canvas that the flipper covers at animation start
      // (so when the flipper lifts away, the destination page is revealed)
      if (direction > 0) {
        // flipper at rotation 0 covers right cell → swap right canvas to new right
        await paintCanvas(toPages.right, rightCanvas, rightCell);
      } else {
        // flipper at rotation −180 covers left cell → swap left canvas to new left
        await paintCanvas(toPages.left, leftCanvas, leftCell);
      }

      flipperLift.classList.add('active');

      const startTx  = computeTx(fromPages);
      const endTx    = computeTx(toPages);
      const startA   = direction > 0 ? 0    : -180;
      const endA     = direction > 0 ? -180 : 0;
      const duration = 880;
      const startTime = performance.now();
      let crossedNinety = false;

      function frame(now) {
        const raw   = Math.min((now - startTime) / duration, 1);
        const t     = easeInOutQuart(raw);
        const angle = startA + (endA - startA) * t;
        const absA  = Math.abs(angle);

        // at the 90° crossover, only paint the underlying destination side if
        // the source had nothing there to begin with (cover↔spread or
        // end-cover↔spread transitions — a brand-new page is being introduced).
        // For spread↔spread, we DON'T paint here: the flipping face does the
        // laydown on top of the old content, and the underlying spread is
        // reconciled in finishFlip while still covered by the resting flipper.
        if (!crossedNinety && absA >= 90) {
          crossedNinety = true;
          const srcCAE  = direction > 0 ? fromPages.left : fromPages.right;
          if (srcCAE == null) {
            const destCAE = direction > 0 ? toPages.left : toPages.right;
            paintCanvas(destCAE,
                        direction > 0 ? leftCanvas : rightCanvas,
                        direction > 0 ? leftCell   : rightCell);
          }
          setSpineVisible(!!(toPages.left && toPages.right));
        }

        // book glides between solo/spread positions during cover↔spread transitions
        const tx = startTx + (endTx - startTx) * t;

        // soft lift toward viewer at midpoint — paper rises off the binding
        const lift = Math.sin(t * Math.PI) * 54;
        bookEl.style.transform      = `translateX(${tx}px)`;
        flipperLift.style.transform = `translateZ(${lift}px)`;
        flipper.style.transform     = `rotateY(${angle}deg)`;

        // page-face shading: gradient runs from spine (light) to free edge (dark)
        const tilt = Math.sin(absA * Math.PI / 180); // 0 → 1 → 0
        const dim  = tilt * 0.42;
        const edgeAlpha  = dim;
        const spineAlpha = dim * 0.16;

        if (absA <= 90) {
          // front face visible — free edge on the (local) right
          frontShade.style.background =
            `linear-gradient(to right, rgba(0,0,0,${spineAlpha}) 0%, rgba(0,0,0,${edgeAlpha}) 100%)`;
          frontShade.style.opacity = 1;
          backShade.style.opacity  = 0;
        } else {
          // back face: its local +x is mirrored vs. the front, so we run the
          // gradient to the left to keep dark on the free edge in world space.
          backShade.style.background =
            `linear-gradient(to left, rgba(0,0,0,${spineAlpha}) 0%, rgba(0,0,0,${edgeAlpha}) 100%)`;
          backShade.style.opacity = 1;
          frontShade.style.opacity = 0;
        }

        // cast shadow on the underlying spread.
        // Strength on each side follows sin(2θ): peaks around 45° on the right,
        // crosses smoothly through zero at 90°, peaks around 135° on the left.
        // Both gradients are always painted; their alphas drive the visibility,
        // so the shadow sweeps from one cell to the other without a hard switch.
        const sweep = Math.sin(absA * 2 * Math.PI / 180); // +1 at 45°, 0 at 90°, −1 at 135°
        const rA = Math.max(0, sweep) * 0.30;
        const lA = Math.max(0, -sweep) * 0.30;
        flipShadow.style.background =
          `linear-gradient(to right,
             rgba(0,0,0,0) 50%,
             rgba(0,0,0,${rA}) 50.5%,
             rgba(0,0,0,${rA * 0.45}) 66%,
             rgba(0,0,0,${rA * 0.12}) 82%,
             rgba(0,0,0,0) 100%),
           linear-gradient(to left,
             rgba(0,0,0,0) 50%,
             rgba(0,0,0,${lA}) 50.5%,
             rgba(0,0,0,${lA * 0.45}) 66%,
             rgba(0,0,0,${lA * 0.12}) 82%,
             rgba(0,0,0,0) 100%)`;
        flipShadow.style.opacity = 1;

        if (raw < 1) {
          requestAnimationFrame(frame);
        } else {
          finishFlip(newPos);
        }
      }

      requestAnimationFrame(frame);
    }

    async function finishFlip(newPos) {
      leafPos = newPos;
      // reconcile the spread to the final state (covers any timing gaps)
      await applyCurrentLeaf();

      // hide flipper, reset transforms
      flipperLift.classList.remove('active');
      flipperLift.style.transform = 'translateZ(0)';
      flipper.style.transform     = 'rotateY(0deg)';
      frontShade.style.opacity = 0;
      backShade.style.opacity  = 0;
      flipShadow.style.opacity = 0;

      animating = false;
      updateNav();
      prefetchAdjacent();

      // process queued turn (single follow-up only)
      if (queuedDirection !== 0) {
        const d = queuedDirection;
        queuedDirection = 0;
        turnPage(d);
      }
    }

    // ── input ────────────────────────────────────────────────
    prevBtn.addEventListener('click', () => turnPage(-1));
    nextBtn.addEventListener('click', () => turnPage(1));

    document.addEventListener('keydown', e => {
      if (!pdfDoc) return;
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp') turnPage(-1);
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        turnPage(1);
      }
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', e => {
      if (!pdfDoc) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) turnPage(dx < 0 ? 1 : -1);
    });

    // ── resize ───────────────────────────────────────────────
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(async () => {
        if (pdfDoc && !animating) {
          renderedCache.clear();
          layoutBook();
          await applyCurrentLeaf();
          prefetchAdjacent();
        }
      }, 150);
    });
  </script>
</body>
</html>
